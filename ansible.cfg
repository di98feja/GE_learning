# Ansible Configuration för GridEnforcer Deployment

[defaults]
# Inventory fil
inventory = ./ansible_playbooks/inventory.yml

# Host key checking (inaktiverat för VM/test-miljöer)
host_key_checking = False

# SSH timeout
timeout = 30

# Parallelism (antal samtidiga anslutningar)
forks = 5

# Gathering av facts (inaktiverat för snabbare körning)
gathering = explicit

# Logging
log_path = ./ansible.log

# Callback plugins för bättre output
stdout_callback = yaml
stderr_callback = yaml

# Ansible pipelining för snabbare SSH
pipelining = True

# Retry files location
retry_files_save_path = ./retry

[ssh_connection]
# SSH timeout
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# SSH pipelining
pipelining = True

# Control path för SSH multiplexing
control_path_dir = ~/.ansible/cp

[privilege_escalation]
# Become settings (använd sudo om behövs)
become = False